[env:freenove_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    ArduinoOTA
    gin66/FastAccelStepper
    thomasfredericks/Bounce2@^2.71
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^7.4.2

; ─────────────────────────────────────────────────────────────────────────────
; This is the Transfer Arm (TA) codebase — `upload_port` below OTA-flashes TA ONLY.
; The four line machines are managed from this TA hub/workstation, but each machine
; has its OWN codebase and is flashed from there. Do NOT flash this firmware onto
; the others. IP / mDNS / repo map (for the dashboard + knowing where each lives):
;
;   Transfer Arm (TA)   192.168.1.228   ta-esp32s3      <- this repo / dashboard host
;   Router              192.168.1.250   router-esp32s3  <- repo: "Router July25"
;   Stage 1             192.168.1.251   stage1-esp32s3  <- repo: "Stage 1 June25"
;   Stage 2             192.168.1.253   stage2-esp32s3  <- repo: "Stage 2 July25"
; ─────────────────────────────────────────────────────────────────────────────
upload_protocol = espota
upload_port = 192.168.1.228       ; Transfer Arm (TA)
; upload_protocol = esptool
