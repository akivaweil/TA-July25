; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_wrover]
platform = espressif32
board = freenove_esp32_wrover
framework = arduino
monitor_speed = 115200
lib_deps = 
    ArduinoOTA
    gin66/FastAccelStepper
    thomasfredericks/Bounce2@^2.71
    madhephaestus/ESP32Servo@^3.0.5

;SEMICOLON COMMENT OUT FOR USB UPLOAD
upload_protocol = espota
upload_port = 192.168.1.236
upload_flags = --port=3232

; Direct USB upload settings (commented out)
upload_port = /dev/cu.usbmodem*
upload_speed = 921600
upload_protocol = esptool

; Old OTA config, kept for reference if needed
; upload_protocol = espota
; upload_port = 192.168.1.249
